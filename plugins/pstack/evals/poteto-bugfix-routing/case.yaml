schema_version: "1.1"
name: poteto-bugfix-routing
description: >-
  /pstack:poteto-mode with a bug report that says "repro first" routes to the
  Bug fix playbook, not another one. The run reads playbooks/bug-fix.md, then
  opens a todo list whose first item is the repro step and whose items follow
  the playbook's order (reproduce before root-causing).
tags: [routing]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/pstack:poteto-mode add(900, 200) returns 1000 instead of 1100. repro first, then fix."
  # Keeps the run cheap. Routing is decided before any repro or fix, and this
  # case grants no shell. max_turns is a backstop, not the stop signal.
  append_system_prompt: >-
    Eval harness note: this run has no shell. Stop as soon as your todo list is
    open and reply with the list. Do not start the fix.
  max_turns: 14
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, TaskCreate, TaskUpdate, TaskList]
graders:
  - name: reads-bug-fix-playbook
    type: tool_used
    tool: Read
    input_match: 'poteto-mode/playbooks/bug-fix\.md'
    min: 1
  - name: no-other-code-playbook
    type: tool_used
    tool: Read
    input_match: 'poteto-mode/playbooks/(feature|refactoring|investigation|perf-issue|prototype)\.md'
    min: 0
    max: 0
    arm: both
  - name: todo-after-playbook
    type: tool_order
    before: {tool: Read, input_match: 'poteto-mode/playbooks/bug-fix\.md'}
    after: TaskCreate
  - name: first-todo-is-repro
    type: tool_order
    before: {tool: TaskCreate, input_match: '"subject":\s*"[^"]*([Rr]eproduc|[Rr]epro\b)'}
    after: {tool: TaskCreate, input_match: '"subject":\s*"(?![^"]*([Rr]eproduc|[Rr]epro\b))'}
  - name: repro-step-before-root-cause-step
    type: tool_order
    before: {tool: TaskCreate, input_match: '"subject":\s*"[^"]*([Rr]eproduc|[Rr]epro\b)'}
    after: {tool: TaskCreate, input_match: '"subject":\s*"[^"]*([Bb]inary.search|[Rr]oot.cause|[Hh]ypothes)'}
